<svg width="40"
     height="40"
     viewBox="0 0 40 40"
     fill="none"
     xmlns="http://www.w3.org/2000/svg">
  <circle cx="20"
          cy="20"
          r="18"
          stroke="url(#haloGradient1)"
          stroke-width="1"
          fill="none"
          opacity="0.4">
    <animate attributeName="stroke-dasharray"
             values="0 113;56 56;0 113"
             dur="4s"
             repeatCount="indefinite" />
  </circle>

  <circle cx="20"
          cy="20"
          r="14"
          stroke="url(#haloGradient2)"
          stroke-width="1.5"
          fill="none"
          opacity="0.6">
    <animate attributeName="stroke-dasharray"
             values="44 44;0 88;44 44"
             dur="3s"
             repeatCount="indefinite" />
  </circle>

  <circle cx="20"
          cy="20"
          r="10"
          stroke="url(#haloGradient3)"
          stroke-width="2"
          fill="none"
          opacity="0.8">
    <animate attributeName="stroke-dasharray"
             values="31 31;0 63;31 31"
             dur="2s"
             repeatCount="indefinite" />
  </circle>

  <circle cx="20"
          cy="20"
          r="3"
          fill="url(#coreGradient)"
          opacity="0.9">
    <animate attributeName="r"
             values="2.5;3.5;2.5"
             dur="2s"
             repeatCount="indefinite" />
    <animate attributeName="opacity"
             values="0.7;1;0.7"
             dur="2s"
             repeatCount="indefinite" />
  </circle>

  <circle cx="26"
          cy="10"
          r="0.8"
          fill="#fbbf24">
    <animate attributeName="opacity"
             values="0;1;0"
             dur="1.8s"
             repeatCount="indefinite" />
  </circle>
  <circle cx="12"
          cy="8"
          r="0.6"
          fill="#06b6d4">
    <animate attributeName="opacity"
             values="0;1;0"
             dur="2.2s"
             begin="0.5s"
             repeatCount="indefinite" />
  </circle>
  <circle cx="30"
          cy="24"
          r="0.7"
          fill="#ec4899">
    <animate attributeName="opacity"
             values="0;1;0"
             dur="1.6s"
             begin="1s"
             repeatCount="indefinite" />
  </circle>
  <circle cx="8"
          cy="28"
          r="0.5"
          fill="#8b5cf6">
    <animate attributeName="opacity"
             values="0;1;0"
             dur="2s"
             begin="1.5s"
             repeatCount="indefinite" />
  </circle>
  <circle cx="32"
          cy="16"
          r="0.4"
          fill="#10b981">
    <animate attributeName="opacity"
             values="0;1;0"
             dur="1.4s"
             begin="0.8s"
             repeatCount="indefinite" />
  </circle>
  <circle cx="10"
          cy="32"
          r="0.6"
          fill="#f59e0b">
    <animate attributeName="opacity"
             values="0;1;0"
             dur="1.9s"
             begin="1.2s"
             repeatCount="indefinite" />
  </circle>

  <defs>
    <linearGradient id="haloGradient1"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
      <stop offset="0%"
            style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%"
            style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%"
            style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="haloGradient2"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
      <stop offset="0%"
            style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%"
            style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%"
            style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="haloGradient3"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
      <stop offset="0%"
            style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%"
            style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="coreGradient"
                    cx="50%"
                    cy="50%"
                    r="50%">
      <stop offset="0%"
            style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%"
            style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%"
            style="stop-color:#f59e0b;stop-opacity:0.8" />
    </radialGradient>
  </defs>
</svg>